
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>AVANTI SHOP - Administrador</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <h:outputStylesheet library="css"
                        name="admin-panel.css"/>
</h:head>
<h:body>

    <div class="admin-container">


        <header class="admin-header">
            <h1>AVANTI SHOP - ADMINISTRADOR</h1>
        </header>

        <div class="admin-body">

            <aside class="sidebar">

                <div class="sidebar-options">

                    <h:link outcome="AdminPanel"
                            styleClass="sidebar-link active-link">

                        <i class="pi pi-file-edit sidebar-icon"></i>

                        <span class="sidebar-text">
                            Gestión de productos
                        </span>

                    </h:link>

                    <h:link outcome="FlujoInventario"
                            styleClass="sidebar-link">

                        <i class="pi pi-chart-bar sidebar-icon"></i>

                        <span class="sidebar-text">
                            Flujo de inventario
                        </span>

                    </h:link>

                </div>

                <h:form id="formCerrarSesion"
                        styleClass="logout-form">

                    <p:commandLink
                            action="#{sesionBean.logout}"
                            ajax="false"
                            styleClass="sidebar-link logout-link"
                            process="@this">

                        <i class="pi pi-sign-out sidebar-icon"></i>

                        <span class="sidebar-text">
                            Cerrar sesión
                        </span>

                    </p:commandLink>

                </h:form>

            </aside>

            <main class="main-content">

                <section class="products-section">

                    <h:form id="formProductos">

                        <div class="title-row">

                            <h2>Lista de productos</h2>

                            <p:commandButton
                                    type="button"
                                    icon="pi pi-plus"
                                    title="Agregar producto"
                                    styleClass="add-button"
                                    onclick="PF('dialogAgregarProducto').show()"/>


                        </div>


                        <p:growl id="mensajes"
                                 showDetail="true"
                                 life="3500"/>
                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true"
                                         styleClass="modal-producto-cafe">

                            <p:commandButton value="Cancelar" type="button"
                                             styleClass="ui-confirmdialog-no boton-cancelar" icon="pi pi-times"/>
                                         <p:commandButton value="Eliminar" type="button"
                                                          styleClass="ui-confirmdialog-yes boton-eliminar" icon="pi pi-trash"/>
                        </p:confirmDialog>
                        <p:panel styleClass="search-panel">

                            <div class="search-controls">

                                <p:inputText
                                        id="busqueda"
                                        value="#{adminPanelBean.busqueda}"
                                        placeholder="Ingrese nombre o ID..."
                                        styleClass="search-input"/>

                                <p:commandButton
                                        value="Buscar"
                                        icon="pi pi-search"
                                        action="#{adminPanelBean.buscarProductos}"
                                        process="@this busqueda productosFilter"
                                        update="tablaProductos mensajes"
                                        styleClass="search-button"/>

                               <p:selectOneMenu id="productosfilter" value="#{adminPanelBean.filtroPorCategoria}">
                                    <f:selectItem itemLabel="Todos los productos" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{adminPanelBean.categorias}" var="cat"
                                                   itemLabel="#{cat.etiqueta}" itemValue="#{cat}"/>
                                   <p:ajax event="change"
                                           listener="#{adminPanelBean.buscarProductos}"
                                           process="@this busqueda"
                                           update="tablaProductos"/>
                               </p:selectOneMenu>




                            </div>

                        </p:panel>

                        <!-- aqui tabla de producto-->
                        <p:panel styleClass="table-panel">

                            <p:dataTable
                                    id="tablaProductos"
                                    value="#{adminPanelBean.listaProductos}"
                                    var="producto"
                                    rowKey="#{producto.id}"
                                    emptyMessage="No hay productos registrados"
                                    reflow="true"
                                    styleClass="products-table">

                                <p:column headerText="ID">

                                    <h:outputText value="#{producto.identificador}"/>

                                </p:column>

                                <p:column headerText="Nombre">

                                    <h:outputText
                                            value="#{producto.nombre}"
                                            styleClass="product-name"/>

                                </p:column>

                                <p:column headerText="Descripción">

                                    <h:outputText
                                            value="#{producto.descripcion}"/>

                                </p:column>

                                <p:column headerText="Precio">

                                    <h:outputText value="#{producto.precio}">

                                        <f:convertNumber
                                                type="currency"
                                                currencySymbol="$"
                                                minFractionDigits="2"
                                                maxFractionDigits="2"/>

                                    </h:outputText>

                                </p:column>

                                <p:column headerText="Cantidad Disponible">

                                    <h:outputText value="#{producto.stock}"/>

                                </p:column>

                                <p:column headerText="Categoría">

                                    <h:outputText
                                            value="#{producto.categoria.etiqueta}"/>

                                </p:column>

                                <p:column headerText="Acciones"
                                          styleClass="actions-column">


                                    <p:commandButton icon="pi pi-pencil"
                                                     title="Editar producto"
                                                     styleClass="edit-button"
                                                     action="#{adminPanelBean.prepararEdicion(producto)}"
                                                     process="@this"
                                                     update=":formEditarProducto"
                                                     oncomplete="PF('dialogEditarProducto').show()">
                                        <p:resetInput target=":formEditarProducto"/>
                                    </p:commandButton>


                                    <p:commandButton
                                            icon="pi pi-trash"
                                            title="Eliminar producto"
                                            styleClass="delete-button"
                                            action="#{adminPanelBean.eliminarProducto(producto)}"
                                            process="@this"
                                            update=":formProductos:tablaProductos :formProductos:mensajes">
                                        <p:confirm header="Eliminar Producto"
                                                   message="¿Esta seguro de eliminar #{producto.nombre}"
                                                   icon="pi pi-exclamation-triangle"/>
                                    </p:commandButton>


                                </p:column>

                            </p:dataTable>
                            <!--Fin de la tabla  -->
                        </p:panel>

                    </h:form>

                </section>

            </main>

        </div>

    </div>
    <ui:include src="agregar-producto.xhtml"/>
    <ui:include src="editar-producto.xhtml"/>
</h:body>
</html>
