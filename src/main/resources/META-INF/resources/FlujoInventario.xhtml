<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>AVANTI SHOP - Flujo de inventario</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <h:outputStylesheet library="css"
                        name="admin-panel.css"/>
    <h:outputStylesheet library="css"
                        name="flujo-inventario.css"/>
</h:head>
<h:body>

    <div class="admin-container">

        <header class="admin-header">
            <h1>AVANTI SHOP - ADMINISTRADOR</h1>
        </header>

        <div class="admin-body">

            <aside class="sidebar">

                <div class="sidebar-options">

                    <h:link outcome="AdminPanel"
                            styleClass="sidebar-link">

                        <i class="pi pi-file-edit sidebar-icon"></i>

                        <span class="sidebar-text">
                            Gestión de productos
                        </span>

                    </h:link>

                    <h:link outcome="FlujoInventario"
                            styleClass="sidebar-link active-link">

                        <i class="pi pi-chart-bar sidebar-icon"></i>

                        <span class="sidebar-text">
                            Flujo de inventario
                        </span>

                    </h:link>

                </div>

                <h:form id="formCerrarSesion"
                        styleClass="logout-form">

                    <p:commandLink
                            action="#{flujoInventarioBean.cerrarSesion}"
                            styleClass="sidebar-link logout-link"
                            process="@this">

                        <i class="pi pi-sign-out sidebar-icon"></i>

                        <span class="sidebar-text">
                            Cerrar sesión
                        </span>

                    </p:commandLink>

                </h:form>

            </aside>

            <main class="main-content">

                <section class="flow-section">

                    <h:form id="formFlujo">

                        <h2 class="flow-title">Control de Flujo de Inventario</h2>

                        <p:confirmDialog global="true"
                                         showEffect="fade"
                                         hideEffect="fade"
                                         responsive="true"
                                         styleClass="modal-producto-cafe">

                            <p:commandButton value="Cancelar"
                                             type="button"
                                             icon="pi pi-times"
                                             styleClass="ui-confirmdialog-no boton-cancelar"/>

                            <p:commandButton value="Eliminar"
                                             type="button"
                                             icon="pi pi-trash"
                                             styleClass="ui-confirmdialog-yes boton-eliminar"/>
                        </p:confirmDialog>

                        <div class="flow-toolbar">

                            <p:panel styleClass="search-panel flow-search-panel">

                                <div class="search-controls">

                                    <p:inputText
                                            id="busqueda"
                                            value="#{flujoInventarioBean.busqueda}"
                                            placeholder="Ingrese ID o nombre del producto..."
                                            styleClass="search-input">
                                        <p:ajax event="keyup"
                                                delay="400"
                                                listener="#{flujoInventarioBean.buscarMovimientos}"
                                                process="@this filtroTipo"
                                                update="tablaMovimientos"/>
                                    </p:inputText>

                                    <p:commandButton
                                            value="Buscar"
                                            icon="pi pi-search"
                                            action="#{flujoInventarioBean.buscarMovimientos}"
                                            process="@this busqueda filtroTipo"
                                            update="tablaMovimientos"
                                            styleClass="search-button"/>

                                    <p:selectOneMenu id="filtroTipo"
                                                     value="#{flujoInventarioBean.filtroPorTipo}">
                                        <f:selectItem itemLabel="Todos los movimientos"
                                                      itemValue="#{null}"
                                                      noSelectionOption="true"/>
                                        <f:selectItems value="#{flujoInventarioBean.tiposMovimiento}"
                                                       var="tipo"
                                                       itemLabel="#{tipo.etiqueta}"
                                                       itemValue="#{tipo}"/>
                                        <p:ajax event="change"
                                                listener="#{flujoInventarioBean.buscarMovimientos}"
                                                process="@this busqueda"
                                                update="tablaMovimientos"/>
                                    </p:selectOneMenu>

                                </div>

                            </p:panel>

                            <div class="flow-actions">

                                <p:commandButton
                                        icon="pi pi-plus"
                                        title="Registrar entrada"
                                        styleClass="entry-button"
                                        action="#{flujoInventarioBean.prepararEntrada}"
                                        process="@this"
                                        update=":dialogMovimiento"
                                        oncomplete="PF('dialogMovimiento').show()"/>

                                <p:commandButton
                                        icon="pi pi-plus"
                                        title="Registrar salida"
                                        styleClass="exit-button"
                                        action="#{flujoInventarioBean.prepararSalida}"
                                        process="@this"
                                        update=":dialogMovimiento"
                                        oncomplete="PF('dialogMovimiento').show()"/>

                            </div>

                        </div>

                        <p:panel styleClass="table-panel">

                            <p:dataTable
                                    id="tablaMovimientos"
                                    value="#{flujoInventarioBean.listaMovimientos}"
                                    var="mov"
                                    rowKey="#{mov.id}"
                                    emptyMessage="No hay movimientos registrados"
                                    reflow="true"
                                    paginator="true"
                                    rows="10"
                                    paginatorAlwaysVisible="false"
                                    styleClass="products-table movements-table">

                                <p:column headerText="ID">
                                    <h:outputText value="#{mov.producto.identificador}"
                                                  styleClass="product-name"/>
                                </p:column>

                                <p:column headerText="Fecha Hora">
                                    <h:outputText value="#{flujoInventarioBean.formatoFecha(mov.fechaHora)}"/>
                                </p:column>

                                <p:column headerText="Producto">
                                    <h:outputText value="#{mov.producto.nombre}"
                                                  styleClass="product-name"/>
                                </p:column>

                                <p:column headerText="Tipo">
                                    <h:outputText value="#{mov.tipo.etiqueta}"
                                                  styleClass="#{mov.entrada ? 'tipo-entrada' : 'tipo-salida'}"/>
                                </p:column>

                                <p:column headerText="Cantidad">
                                    <h:outputText value="#{flujoInventarioBean.cantidadConSigno(mov)}"
                                                  styleClass="movement-qty #{mov.entrada ? 'tipo-entrada' : 'tipo-salida'}"/>
                                </p:column>

                                <p:column headerText="Categoría">
                                    <h:outputText value="#{mov.producto.categoria.etiqueta}"/>
                                </p:column>

                                <p:column headerText="Acciones"
                                          styleClass="actions-column">

                                    <p:commandButton
                                            icon="pi pi-pencil"
                                            title="Editar movimiento"
                                            styleClass="edit-button"
                                            action="#{flujoInventarioBean.prepararEdicion(mov)}"
                                            process="@this"
                                            update=":dialogMovimiento"
                                            oncomplete="PF('dialogMovimiento').show()"/>

                                    <p:commandButton
                                            icon="pi pi-trash"
                                            title="Eliminar movimiento"
                                            styleClass="delete-button"
                                            action="#{flujoInventarioBean.eliminarMovimiento(mov)}"
                                            process="@this"
                                            update=":formFlujo:tablaMovimientos :mensajes">
                                        <p:confirm header="Eliminar movimiento"
                                                   message="¿Está seguro de eliminar este movimiento de #{mov.producto.nombre}? Se revertirá su efecto en el stock."
                                                   icon="pi pi-exclamation-triangle"/>
                                    </p:commandButton>

                                </p:column>

                            </p:dataTable>

                        </p:panel>

                    </h:form>

                </section>

            </main>

        </div>

    </div>

    <p:growl id="mensajes"
             showDetail="true"
             life="3500"/>

    <p:dialog id="dialogMovimiento"
              widgetVar="dialogMovimiento"
              header="#{flujoInventarioBean.tituloDialogo}"
              modal="true"
              closable="true"
              closeOnEscape="false"
              resizable="false"
              draggable="false"
              width="440"
              appendTo="@(body)"
              styleClass="modal-producto-cafe">

        <h:form id="formMovimiento">

            <p:panelGrid columns="1"
                         layout="grid"
                         styleClass="ui-fluid formulario-producto">

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel value="Tipo de movimiento"/>

                    <h:outputText value="#{flujoInventarioBean.tipoMovimiento.etiqueta}"
                                  styleClass="tipo-badge #{flujoInventarioBean.tipoMovimiento.entrada ? 'tipo-entrada' : 'tipo-salida'}"/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="producto"
                                   value="Producto"/>

                    <p:selectOneMenu
                            id="producto"
                            value="#{flujoInventarioBean.productoId}"
                            filter="true"
                            filterMatchMode="contains"
                            appendTo="@(body)"
                            disabled="#{flujoInventarioBean.modoEdicion}"
                            required="true"
                            requiredMessage="Selecciona un producto.">

                        <f:selectItem itemLabel="Selecciona un producto"
                                      itemValue="#{null}"
                                      noSelectionOption="true"/>

                        <f:selectItems value="#{flujoInventarioBean.productosDisponibles}"
                                       var="prod"
                                       itemLabel="#{prod.identificador} - #{prod.nombre} (Stock: #{prod.stock})"
                                       itemValue="#{prod.id}"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="cantidad"
                                   value="Cantidad"/>

                    <p:inputNumber
                            id="cantidad"
                            value="#{flujoInventarioBean.cantidad}"
                            minValue="1"
                            decimalPlaces="0"
                            thousandSeparator=","
                            required="true"
                            requiredMessage="Ingresa la cantidad."/>
                </h:panelGroup>

            </p:panelGrid>

            <p:separator styleClass="separador-producto"/>

            <h:panelGroup layout="block"
                          styleClass="acciones-producto">

                <p:commandButton
                        value="Cancelar"
                        icon="pi pi-times"
                        type="button"
                        onclick="PF('dialogMovimiento').hide()"
                        styleClass="boton-cancelar"/>

                <p:commandButton
                        value="Guardar"
                        icon="pi pi-check"
                        action="#{flujoInventarioBean.guardarMovimiento}"
                        process="@form"
                        update=":mensajes :formFlujo:tablaMovimientos"
                        oncomplete="if (args.guardado) PF('dialogMovimiento').hide()"
                        styleClass="boton-agregar"/>

            </h:panelGroup>

        </h:form>
    </p:dialog>

</h:body>
</html>
