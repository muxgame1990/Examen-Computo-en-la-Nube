<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>AVANTI SHOP - Iniciar sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap"/>
    <h:outputStylesheet library="css" name="login.css"/>
</h:head>

<h:body styleClass="login-body">

    <header class="login-header">
        <h1>AVANTI SHOP</h1>
    </header>

    <main class="login-main">

        <div class="login-card">

            <h2 class="login-titulo">Iniciar sesión</h2>

            <h:form id="formLogin">

                <p:growl id="mensajes" showDetail="true" life="3500"/>

                <div class="login-campo">
                    <p:outputLabel for="usuario" value="Usuario"/>
                    <p:inputText id="usuario"
                                 value="#{sesionBean.usuario}"
                                 placeholder="Ingresa tu usuario"
                                 required="true"
                                 requiredMessage="Escribe tu usuario."/>
                </div>

                <div class="login-campo">
                    <p:outputLabel for="password" value="Contraseña"/>
                    <p:password id="password"
                                value="#{sesionBean.password}"
                                placeholder="Ingresa tu contraseña"
                                toggleMask="true"
                                feedback="false"
                                required="true"
                                requiredMessage="Escribe tu contraseña."/>
                </div>

                <p:commandButton id="btnEntrar"
                                 value="Iniciar sesión"
                                 action="#{sesionBean.login}"
                                 process="@form"
                                 update="mensajes password"
                                 styleClass="login-boton"/>

                <p:defaultCommand target="btnEntrar"/>

                <p class="login-registro">
                    ¿No tienes cuenta?
                    <p:commandLink value="Regístrate"
                                   process="@this"
                                   update=":formRegistro"
                                   oncomplete="PF('dlgRegistro').show()">
                        <p:resetInput target=":formRegistro"/>
                    </p:commandLink>
                </p>

                <p class="login-registro">
                    <a href="index.xhtml">Volver a la tienda</a>
                </p>

            </h:form>

        </div>

    </main>

    <p:dialog widgetVar="dlgRegistro"
              header="Crear cuenta"
              modal="true"
              resizable="false"
              draggable="false"
              responsive="true"
              width="420"
              styleClass="registro-dialogo">

        <h:form id="formRegistro">

            <p:messages id="mensajesRegistro" showDetail="true" closable="true"/>

            <div class="login-campo">
                <p:outputLabel for="nuevoNombre" value="Nombre"/>
                <p:inputText id="nuevoNombre"
                             value="#{loginBean.nuevoNombre}"
                             placeholder="Ingresa tu nombre"
                             maxlength="80"
                             required="true"
                             requiredMessage="Escribe tu nombre."/>
            </div>

            <div class="login-campo">
                <p:outputLabel for="nuevoUsuario" value="Usuario"/>
                <p:inputText id="nuevoUsuario"
                             value="#{loginBean.nuevoUsuario}"
                             placeholder="Elige un nombre de usuario"
                             maxlength="45"
                             required="true"
                             requiredMessage="Escribe un usuario."/>
            </div>

            <div class="login-campo">
                <p:outputLabel for="nuevoPassword" value="Contraseña"/>
                <p:password id="nuevoPassword"
                            value="#{loginBean.nuevoPassword}"
                            placeholder="Crea una contraseña"
                            maxlength="45"
                            toggleMask="true"
                            feedback="false"
                            required="true"
                            requiredMessage="Escribe una contraseña."/>
            </div>

            <div class="login-campo">
                <p:outputLabel for="confirmarPassword" value="Confirmar contraseña"/>
                <p:password id="confirmarPassword"
                            value="#{loginBean.confirmPassword}"
                            placeholder="Repite la contraseña"
                            maxlength="45"
                            toggleMask="true"
                            feedback="false"
                            required="true"
                            requiredMessage="Confirma tu contraseña."/>
            </div>

            <p:commandButton value="Crear cuenta"
                             action="#{loginBean.registrar}"
                             process="@form"
                             update="mensajesRegistro"
                             oncomplete="if (args.registrado) PF('dlgRegistro').hide()"
                             styleClass="login-boton"/>

        </h:form>
    </p:dialog>

</h:body>
</html>
