<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="dialogEditarProducto"
              widgetVar="dialogEditarProducto"
              header="Editar producto"
              modal="true"
              closable="true"
              closeOnEscape="false"
              resizable="false"
              draggable="false"
              width="480"
              styleClass="modal-producto-cafe">

        <h:form id="formEditarProducto"
                enctype="multipart/form-data">

            <p:messages id="mensajesEdicion"
                        showDetail="true"
                        closable="true"/>

            <p:panelGrid columns="1"
                         layout="grid"
                         styleClass="ui-fluid formulario-producto">

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel value="Imagen del producto"/>

                    <h:panelGroup id="imagenActualEdicion" layout="block">
                        <p:graphicImage value="#{adminPanelBean.urlImagenEdicion}"
                                        rendered="#{not empty adminPanelBean.urlImagenEdicion}"
                                        width="120"/>
                    </h:panelGroup>

                    <p:fileUpload id="imagenEdicion"
                                  mode="advanced"
                                  auto="true"
                                  listener="#{adminPanelBean.subirImagenEdicion}"
                                  accept="image/jpeg,image/png,image/gif"
                                  sizeLimit="5242880"
                                  invalidSizeMessage="La imagen no debe superar los 5 MB."
                                  invalidFileMessage="Selecciona un archivo de imagen."
                                  label="Cambiar imagen"
                                  update="mensajesEdicion imagenActualEdicion"
                                  styleClass="imagen-producto"/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="editarIdentificador"
                                   value="Identificador del producto"/>

                    <p:inputText id="editarIdentificador"
                                 value="#{adminPanelBean.productoEnEdicion.identificador}"
                                 readonly="true"/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="editarNombre"
                                   value="Nombre del producto"/>

                    <p:inputText id="editarNombre"
                                 value="#{adminPanelBean.productoEnEdicion.nombre}"
                                 maxlength="45"
                                 required="true"
                                 requiredMessage="Ingresa el nombre del producto."/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="editarDescripcion"
                                   value="Descripción"/>

                    <p:inputTextarea id="editarDescripcion"
                                     value="#{adminPanelBean.productoEnEdicion.descripcion}"
                                     rows="2"
                                     autoResize="false"
                                     maxlength="100"
                                     required="true"
                                     requiredMessage="Ingresa la descripción."/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel value="Categoría"/>

                    <h:outputText value="#{adminPanelBean.productoEnEdicion.categoria.etiqueta}"
                                  styleClass="campo-solo-lectura"/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="editarPrecio"
                                   value="Precio"/>

                    <p:inputNumber id="editarPrecio"
                                   value="#{adminPanelBean.productoEnEdicion.precio}"
                                   minValue="0"
                                   decimalPlaces="2"
                                   decimalSeparator="."
                                   thousandSeparator=","
                                   required="true"
                                   requiredMessage="Ingresa el precio."/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel value="Stock actual"/>

                    <h:outputText value="#{adminPanelBean.productoEnEdicion.stock} piezas (se modifica desde Flujo de inventario)"/>
                </h:panelGroup>

            </p:panelGrid>

            <p:separator styleClass="separador-producto"/>

            <h:panelGroup layout="block"
                          styleClass="acciones-producto">

                <p:commandButton value="Cancelar"
                                 icon="pi pi-times"
                                 type="button"
                                 onclick="PF('dialogEditarProducto').hide()"
                                 styleClass="boton-cancelar"/>

                <p:commandButton value="Guardar cambios"
                                 icon="pi pi-check"
                                 action="#{adminPanelBean.guardarEdicion}"
                                 process="@form"
                                 update="mensajesEdicion :formProductos:tablaProductos :formProductos:mensajes"
                                 oncomplete="if (args.editado) PF('dialogEditarProducto').hide()"
                                 styleClass="boton-agregar"/>

            </h:panelGroup>

        </h:form>
    </p:dialog>

</ui:composition>
