
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Agregar producto</title>
    <h:outputStylesheet library="css" name="admin-panel.css"/>
</h:head>

<h:body>

    <p:dialog id="dialogAgregarProducto"
              widgetVar="dialogAgregarProducto"
              header="Agregar producto"
              modal="true"
              closable="true"
              closeOnEscape="false"
              resizable="false"
              draggable="false"
              width="480"
              appendTo="@(body)"
              styleClass="modal-producto-cafe">

        <h:form id="formAgregarProducto"
                enctype="multipart/form-data">

            <p:messages id="mensajes"
                        showDetail="true"
                        closable="true"/>

            <p:panelGrid columns="1"
                         layout="grid"
                         styleClass="ui-fluid formulario-producto">
                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel value="Imagen del producto" />

                    <p:fileUpload
                            id="imagenProducto"
                            mode="advanced"
                            auto="true"
                            listener="#{adminPanelBean.subirImagen}"
                            accept="image/jpeg,image/png,image/gif"
                            sizeLimit="5242880"
                            invalidSizeMessage="La imagen no debe superar los 5 MB."
                            invalidFileMessage="Selecciona un archivo de imagen."
                            label="Seleccionar imagen"
                            uploadLabel="Subir"
                            cancelLabel="Cancelar carga"
                            update="mensajes imagenActual"
                            styleClass="imagen-producto"/>
                </h:panelGroup>

                <p:outputLabel id="imagenActual">
                    <p:graphicImage
                        value="#{adminPanelBean.urlImagen}"
                        rendered="#{not empty adminPanelBean.urlImagen}"
                        width="120" />

                </p:outputLabel>


                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="identificador"
                                   value="Identificador del producto"/>

                    <p:inputText
                            id="identificador"
                            value="#{adminPanelBean.idTemporal}"
                            readonly="true"
                            placeholder="Selecciona una categoría"/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="nombre"
                                   value="Nombre del producto"/>

                    <p:inputText
                            id="nombre"
                            value="#{adminPanelBean.producto.nombre}"
                            required="true"
                            requiredMessage="Ingresa el nombre del producto."/>

                </h:panelGroup>


                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="descripcion"
                                   value="Descripcion"/>

                    <p:inputTextarea
                            id="descripcion"
                            value="#{adminPanelBean.producto.descripcion}"
                            rows="2"
                            autoResize="false"
                            required="true"
                            requiredMessage="Ingresa la descripción."/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="categoria"
                                   value="Categoria"/>

                    <p:selectOneMenu
                            id="categoria"
                            value="#{adminPanelBean.producto.categoria}"
                            required="true"
                            requiredMessage="Selecciona una categoría.">

                        <f:selectItem
                                itemLabel="Selecciona una categoría"
                                itemValue="#{null}"
                                noSelectionOption="true"/>

                        <f:selectItems
                                value="#{adminPanelBean.categorias}"
                                var="cat"
                                itemLabel="#{cat.etiqueta}"
                                itemValue="#{cat}"/>

                        <p:ajax
                                event="change"
                                listener="#{adminPanelBean.actualizarIdentificadorProvisional}"
                                process="@this"
                                update="identificador"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="precio"
                                   value="Precio"/>

                    <p:inputNumber
                            id="precio"
                            value="#{adminPanelBean.producto.precio}"
                            minValue="0"
                            decimalPlaces="2"
                            decimalSeparator="."
                            thousandSeparator=","
                            required="true"
                            requiredMessage="Ingresa el precio."/>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="campo-producto">

                    <p:outputLabel for="cantidad"
                                   value="Cantidad"/>

                    <p:inputNumber
                            id="cantidad"
                            value="#{adminPanelBean.producto.stock}"
                            minValue="0"
                            decimalPlaces="0"
                            thousandSeparator=","
                            required="true"
                            requiredMessage="Ingresa la cantidad."/>
                </h:panelGroup>

            </p:panelGrid>

            <p:separator styleClass="separador-producto"/>

            <h:panelGroup layout="block"
                          styleClass="acciones-producto">

                <p:commandButton
                        value="Cancelar"
                        icon="pi pi-times"
                        type="button"
                        onclick="PF('dialogAgregarProducto').hide()"
                        styleClass="boton-cancelar"/>

                <p:commandButton
                        value="Agregar"
                        icon="pi pi-check"
                        action="#{adminPanelBean.agregarProducto}"
                        process="@form"
                        update="mensajes: formProductos:tablaProductos :formProductos:mensajes"
                        oncomplete="if (!args.validationFailed) PF('dialogAgregarProducto').hide()"
                        styleClass="boton-agregar"/>

            </h:panelGroup>

        </h:form>
    </p:dialog>

</h:body>
</html>
